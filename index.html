<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procables - Acceso Inicial</title>
    <link rel="stylesheet" href=".css/styles.css">
</head>
<body>

    <div class="container">
        <h2>PROCABLES</h2>
        <p>Capacitación y Consulta Operativa Offline</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="workerId">Cédula o ID de Trabajador:</label>
                <input type="text" id="workerId" placeholder="Ej. 101084" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="workerName">Nombre Completo:</label>
                <input type="text" id="workerName" placeholder="Ej. Hamilton Ortiz" required autocomplete="off">
            </div>

            <button type="submit" class="btn">Ingresar al Sistema</button>
            
            <div id="errorAlert" class="error-msg">
                Por favor ingrese datos válidos.
            </div>
        </form>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
