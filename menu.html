<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procables - Menú de Estaciones</title>
    <link rel="stylesheet" href=".css/styles.css">
</head>
<body>

    <div class="container" style="max-width: 600px;">
        <h2>Seleccione una Estación</h2>
        <p>Elija la máquina que desea consultar o capacitar:</p>

        <div class="menu-grid">
            <a href="player.html?maquina=trefiladora" class="card-station">

            </a>
            <a href="player.html?maquina=cableadora" class="card-station">

            </a>
            <a href="player.html?maquina=extrusora" class="card-station">
                🏭 Estación 3: Extrusora
            </a>

        <button onclick="cerrarSesion()" class="btn" style="background-color: #6c757d; margin-top: 30px;">Cerrar Sesión</button>
    </div>

    <script>
        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
